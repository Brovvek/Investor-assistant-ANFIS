<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market ANFIS Pro</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #131722; /* Ciemne tło jak w TradingView */
            color: #d1d4dc; 
            margin: 0; 
            padding: 20px; 
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            padding-bottom: 10px; 
            border-bottom: 1px solid #2a2e39; 
        }
        .controls { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }
        input[type="text"] { 
            padding: 8px 12px; 
            border-radius: 4px; 
            border: 1px solid #363a45; 
            background: #2a2e39; 
            color: #fff; 
            outline: none;
        }
        input[type="text"]:focus { border-color: #2962ff; }
        button { 
            padding: 8px 20px; 
            border-radius: 4px; 
            border: none; 
            background: #2962ff; 
            color: #fff; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        button:hover { background: #1e53e5; }
        
        /* Kontener na wykres zajmuje resztę ekranu */
        .chart-wrapper { 
            flex-grow: 1; 
            background: #1e222d; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative;
        }
        #combinedChart {
            width: 100%;
            height: 100%;
        }
        .loading { 
            color: #f0ad4e; 
            font-size: 0.9em; 
            margin-left: 10px;
            display: none; 
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-size: 1.2em; font-weight: bold;">Investor Assistant <span style="color: #2962ff">ANFIS</span></div>
        
        <div class="controls">
            <input type="text" id="tickerInput" value="^GSPC" placeholder="Symbol (np. ^NDX)">
            <button onclick="runAnalysis()">Analizuj Rynek</button>
            <span id="loadingMsg" class="loading">Przetwarzanie danych makro i AI...</span>
        </div>
    </div>

    <div class="chart-wrapper">
        <div id="combinedChart"></div>
    </div>

    <script>
        // Uruchomienie domyślnej analizy przy starcie
        window.onload = function() {
            runAnalysis();
        };

        async function runAnalysis() {
            const ticker = document.getElementById('tickerInput').value;
            const loading = document.getElementById('loadingMsg');
            
            loading.style.display = 'inline';
            
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticker: ticker })
                });
                
                const data = await response.json();
                if(data.error) { alert("Błąd: " + data.error); return; }
                
                drawCombinedChart(data);
            } catch (err) {
                console.error(err);
                alert("Błąd połączenia z serwerem.");
            } finally {
                loading.style.display = 'none';
            }
        }

        function drawCombinedChart(data) {
            // --- DANE ---
            
            // 1. Cena (Górny panel)
            const tracePrice = {
                x: data.Date,
                y: data.Price,
                name: 'Cena',
                type: 'scatter',
                mode: 'lines',
                line: { color: '#2962ff', width: 2 },
                xaxis: 'x',
                yaxis: 'y' // Przypisane do pierwszej osi Y
            };

            // 2. Oscylator ANFIS (Dolny panel)
            const traceOscillator = {
                x: data.Date,
                y: data.Sentiment_Oscillator,
                name: 'ANFIS Sentiment',
                type: 'scatter',
                mode: 'lines',
                line: { color: '#f38ba8', width: 2 },
                fill: 'tozeroy', // Wypełnienie kolorem pod wykresem
                fillcolor: 'rgba(243, 139, 168, 0.1)',
                xaxis: 'x',
                yaxis: 'y2' // Przypisane do drugiej osi Y (Subplot)
            };

            // --- UKŁAD (LAYOUT) ---
            const layout = {
                grid: {
                    rows: 2, 
                    columns: 1, 
                    pattern: 'independent',
                    roworder: 'top to bottom'
                },
                // Marginesy i tło
                margin: { t: 40, b: 40, l: 60, r: 40 },
                paper_bgcolor: '#131722',
                plot_bgcolor: '#1e222d',
                font: { color: '#d1d4dc' },
                
                // Interakcja
                hovermode: 'x unified', // TO JEST KLUCZ DO SYNCHRONIZACJI
                dragmode: 'zoom',
                
                // Oś X (Wspólna)
                xaxis: {
                    showgrid: true,
                    gridcolor: '#2a2e39',
                    rangeslider: { visible: false }, // Wyłączamy slider bo zabiera miejsce
                    anchor: 'y2' // Oś X jest pod dolnym wykresem
                },

                // Oś Y1 (Cena - Górne 70% ekranu)
                yaxis: {
                    domain: [0.35, 1], // Od 35% do 100% wysokości
                    gridcolor: '#2a2e39',
                    title: 'Cena Aktywa'
                },

                // Oś Y2 (Oscylator - Dolne 25% ekranu)
                yaxis2: {
                    domain: [0, 0.25], // Od 0% do 25% wysokości
                    gridcolor: '#2a2e39',
                    title: 'Sentyment (0-100)',
                    range: [0, 100], // Sztywny zakres dla oscylatora
                    fixedrange: true // Blokada zoomowania w pionie dla oscylatora
                },
                
                // Linie pomocnicze na oscylatorze
                shapes: [
                    // Linia 20 (Zielona strefa okazji)
                    {
                        type: 'line', xref: 'paper', x0: 0, x1: 1,
                        yref: 'y2', y0: 20, y1: 20,
                        line: { color: 'rgba(0, 255, 0, 0.3)', width: 1, dash: 'dot' }
                    },
                    // Linia 80 (Czerwona strefa ryzyka)
                    {
                        type: 'line', xref: 'paper', x0: 0, x1: 1,
                        yref: 'y2', y0: 80, y1: 80,
                        line: { color: 'rgba(255, 0, 0, 0.3)', width: 1, dash: 'dot' }
                    }
                ]
            };

            const config = {
                responsive: true,
                displayModeBar: true, // Pasek narzędzi (zoom, pan, etc.)
                modeBarButtonsToRemove: ['lasso2d', 'select2d']
            };

            Plotly.newPlot('combinedChart', [tracePrice, traceOscillator], layout, config);
        }
    </script>
</body>
</html>
